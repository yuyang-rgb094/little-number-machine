<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3eddf">
  <title>数字咔哒机 · 给小小数字观察员</title>
  <style>
    :root {
      --paper: #f3eddf;
      --paper-deep: #e8decb;
      --ink: #243832;
      --muted: #6f7970;
      --cream: #fffaf0;
      --orange: #ee7245;
      --orange-dark: #ca4e2c;
      --yellow: #f4c65d;
      --green: #4f7a65;
      --metal: #d7d0be;
      --line: #c9bfaa;
      --shadow: 0 18px 45px rgba(64, 53, 35, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.65) 0 2px, transparent 3px),
        radial-gradient(circle at 85% 75%, rgba(93,78,52,.05) 0 1px, transparent 2px),
        var(--paper);
      background-size: 37px 37px, 29px 29px, auto;
      font-family: "PingFang SC", "Microsoft YaHei", "Arial Rounded MT Bold", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }
    button:focus-visible, summary:focus-visible {
      outline: 4px solid rgba(238, 114, 69, .28);
      outline-offset: 4px;
    }

    .page {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }

    .brand-mark {
      display: grid;
      grid-template-columns: repeat(2, 16px);
      gap: 3px;
      padding: 8px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: var(--yellow);
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(-3deg);
    }

    .brand-mark span {
      display: grid;
      place-items: center;
      width: 16px;
      height: 22px;
      color: var(--cream);
      background: var(--ink);
      border-radius: 3px;
      font: 700 15px/1 ui-monospace, monospace;
    }

    h1 { margin: 0; font-size: clamp(23px, 3vw, 31px); letter-spacing: 2px; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 2px; }

    .sound-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 9px 15px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,250,240,.65);
      cursor: pointer;
    }

    .sound-toggle[aria-pressed="false"] { color: var(--muted); opacity: .72; }

    .lessons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .lesson-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 10px 16px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      color: var(--muted);
      background: rgba(255,250,240,.45);
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, background .2s, box-shadow .2s;
    }

    .lesson-tab:hover { transform: translateY(-2px); background: var(--cream); }
    .lesson-tab[aria-selected="true"] {
      color: var(--cream);
      border-color: var(--ink);
      background: var(--ink);
      box-shadow: 0 5px 0 rgba(36,56,50,.16);
    }

    .lesson-number {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font: 700 12px/1 ui-monospace, monospace;
    }

    .machine {
      position: relative;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 30px;
      background: var(--cream);
      box-shadow: 8px 9px 0 var(--ink), var(--shadow);
    }

    .machine::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(54,45,28,.025) 4px);
    }

    .machine-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 28px;
      border-bottom: 1.5px solid var(--line);
      background: #ece4d3;
    }

    .machine-id {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font: 700 11px/1.2 ui-monospace, monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-light {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #75a479;
      box-shadow: 0 0 0 4px rgba(117,164,121,.15);
    }

    .mini-button {
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--cream);
      cursor: pointer;
    }

    .play-area {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr);
      min-height: 480px;
    }

    .counter-side { padding: 34px 34px 30px; }
    .visual-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      border-left: 1.5px dashed var(--line);
      background: #f6f0e4;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    h2 { margin: 0; font-size: clamp(25px, 3.5vw, 37px); line-height: 1.3; letter-spacing: 1px; }
    .lesson-intro { margin: 10px 0 25px; color: var(--muted); font-size: 15px; line-height: 1.7; }

    .counter-case {
      position: relative;
      padding: 27px 24px 20px;
      border: 2px solid #182720;
      border-radius: 22px;
      background: #34473f;
      box-shadow: inset 0 0 0 5px #41564c, inset 0 -10px 20px rgba(0,0,0,.16), 0 6px 0 #1e2e27;
    }

    .screw {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1px solid #101b17;
      border-radius: 50%;
      background: #98a198;
      box-shadow: inset 1px 1px 1px rgba(255,255,255,.5);
    }
    .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1px; background: #33453d; transform: rotate(-25deg); }
    .screw.tl { left: 9px; top: 9px; }
    .screw.tr { right: 9px; top: 9px; }
    .screw.bl { left: 9px; bottom: 9px; }
    .screw.br { right: 9px; bottom: 9px; }

    .digits {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      min-height: 126px;
    }

    .digit-wrap { text-align: center; }

    .digit-card {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(62px, 8vw, 88px);
      height: 108px;
      overflow: hidden;
      border: 2px solid #111b17;
      border-radius: 10px;
      color: #fff8df;
      background: #17251f;
      box-shadow: inset 0 0 18px rgba(0,0,0,.55), 0 2px 0 #647169;
      perspective: 500px;
    }

    .digit-card::before {
      content: "";
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      top: 50%;
      height: 2px;
      background: #080e0b;
      box-shadow: 0 -1px 0 rgba(255,255,255,.09), 0 2px 3px rgba(0,0,0,.6);
    }

    .digit-card::after {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,.07), transparent 48%, rgba(0,0,0,.16) 52%);
    }

    .digit {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding-bottom: 4px;
      font: 700 clamp(61px, 8vw, 82px)/1 "Courier New", ui-monospace, monospace;
      backface-visibility: hidden;
      text-shadow: 0 3px 2px #000;
    }

    .old-digit { z-index: 2; animation: flip-out .24s ease-in forwards; transform-origin: 50% 50%; }
    .new-digit { animation: flip-in .3s .21s ease-out both; transform-origin: 50% 50%; }

    @keyframes flip-out { from { transform: rotateX(0); opacity: 1; } to { transform: rotateX(-90deg); opacity: .5; } }
    @keyframes flip-in { from { transform: rotateX(90deg); opacity: .5; } to { transform: rotateX(0); opacity: 1; } }

    .digit-label {
      display: block;
      margin-top: 9px;
      color: #d7dfd4;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .decimal-wrap { align-self: flex-start; text-align: center; }
    .decimal-card {
      display: grid;
      place-items: center;
      width: 35px;
      height: 108px;
      color: var(--yellow);
      font: 800 64px/1 ui-monospace, monospace;
      text-shadow: 0 3px 2px #000;
    }
    .decimal-wrap .digit-label { color: var(--yellow); letter-spacing: 0; }

    .machine-message {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      margin: 18px 0 15px;
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--ink);
      background: #f2e7c9;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.55;
      text-align: center;
    }

    .machine-message.celebrate { background: #f9d98c; animation: message-pop .4s ease; }
    @keyframes message-pop { 50% { transform: scale(1.025); } }

    .controls { display: flex; align-items: stretch; justify-content: center; gap: 10px; }

    .main-button {
      flex: 1;
      min-height: 62px;
      padding: 12px 22px;
      border: 2px solid #a94227;
      border-radius: 15px;
      color: #fffaf1;
      background: var(--orange);
      box-shadow: 0 5px 0 #a94227;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
    }

    .main-button:hover { filter: brightness(1.04); }
    .main-button:active { transform: translateY(4px); box-shadow: 0 1px 0 #a94227; }
    .main-button:disabled { opacity: .38; cursor: default; transform: none; box-shadow: 0 3px 0 #8c897e; }

    .back-button {
      min-width: 72px;
      border: 1.5px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      background: #f7f0e3;
      box-shadow: 0 4px 0 #d7cbb6;
      font-size: 22px;
      cursor: pointer;
    }
    .back-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d7cbb6; }
    .back-button:disabled { opacity: .35; cursor: default; }

    .shortcuts {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }
    .shortcuts > span { margin-right: 3px; color: var(--muted); font-size: 12px; }
    .shortcut {
      min-height: 34px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }
    .shortcut:hover, .shortcut.active { color: var(--ink); border-color: var(--green); background: #e5eee4; }

    .visual-title { margin: 16px 0 4px; font-size: 20px; }
    .visual-caption { max-width: 260px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }

    .listen-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding: 9px 16px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--cream);
      cursor: pointer;
    }

    /* Carry: a little route for the digit, not objects to count. */
    .route {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin: 16px 0 4px;
    }
    .route-digit {
      display: grid;
      place-items: center;
      width: 43px;
      height: 50px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      background: var(--cream);
      font: 700 25px/1 ui-monospace, monospace;
    }
    .route-digit.hot { color: #fff; border-color: var(--orange); background: var(--orange); transform: rotate(-5deg); }
    .route-arrow { color: var(--muted); font-size: 22px; }
    .route-plus { color: var(--green); font-size: 13px; font-weight: 800; }

    /* Decimal: full cup + part of the next cup. */
    .cups {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      min-height: 174px;
      padding-top: 15px;
    }
    .cup {
      position: relative;
      width: 82px;
      height: 132px;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-top-width: 2px;
      border-radius: 7px 7px 21px 21px;
      background: rgba(255,255,255,.4);
      box-shadow: inset 6px 0 rgba(255,255,255,.4);
    }
    .cup::before { content: ""; position: absolute; z-index: 3; top: 7px; left: -4px; right: -4px; height: 5px; border: 2px solid var(--ink); border-radius: 50%; background: #f8f3e8; }
    .cup::after { content: ""; position: absolute; z-index: 2; left: 12px; right: 12px; top: 48%; border-top: 1px dashed rgba(36,56,50,.35); }
    .juice {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--fill);
      min-height: 2px;
      background: #f5a34d;
      transition: height .55s cubic-bezier(.2,.8,.2,1);
    }
    .juice::before { content: ""; position: absolute; left: -10%; top: -5px; width: 120%; height: 10px; border-radius: 50%; background: #ffc06c; }
    .cup-label { margin-top: 7px; color: var(--muted); font-size: 11px; }

    /* Floating point: the same digits, a different amount. */
    .tree-scene { position: relative; width: 230px; height: 210px; }
    .tree-scene svg { width: 100%; height: 100%; overflow: visible; }
    .tree-grow { transform-origin: 120px 177px; transform: scale(var(--grow)); transition: transform .65s cubic-bezier(.2,.8,.2,1); }
    .point-steps { display: flex; gap: 8px; margin-top: 14px; }
    .point-step { width: 28px; height: 5px; border-radius: 4px; background: #d8cebc; }
    .point-step.active { background: var(--orange); }

    .parent-note {
      position: relative;
      padding: 17px 26px;
      border-top: 1.5px solid var(--line);
      background: #eee5d4;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }
    .parent-note summary { color: var(--ink); font-weight: 800; cursor: pointer; }
    .parent-note p { margin: 8px 0 0; }

    .footer { margin: 23px 0 0; color: var(--muted); font-size: 12px; text-align: center; letter-spacing: 1px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .hidden { display: none !important; }

    @media (max-width: 800px) {
      .play-area { grid-template-columns: 1fr; }
      .visual-side { min-height: 270px; border-top: 1.5px dashed var(--line); border-left: 0; padding: 25px; }
      .counter-side { padding: 30px; }
      .cups { min-height: 135px; }
      .cup { width: 65px; height: 105px; }
      .tree-scene { height: 160px; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 22px, 1120px); padding-top: 18px; }
      .topbar { margin-bottom: 18px; }
      .brand p { display: none; }
      .brand-mark { grid-template-columns: repeat(2, 12px); padding: 6px; }
      .brand-mark span { width: 12px; height: 18px; font-size: 12px; }
      .sound-toggle { padding: 8px 11px; font-size: 12px; }
      .lessons { gap: 7px; }
      .lesson-tab { flex-direction: column; gap: 4px; min-height: 70px; padding: 7px 3px; font-size: 12px; }
      .lesson-number { width: 23px; height: 23px; font-size: 10px; }
      .machine { border-radius: 22px; box-shadow: 5px 6px 0 var(--ink), var(--shadow); }
      .machine-top { padding: 13px 17px; }
      .machine-id { font-size: 9px; letter-spacing: 1px; }
      .counter-side { padding: 25px 14px 23px; }
      .lesson-intro { margin-bottom: 19px; font-size: 14px; }
      .counter-case { padding: 23px 10px 17px; }
      .digits { gap: 4px; min-height: 108px; }
      .digit-card { width: clamp(54px, 18vw, 76px); height: 91px; }
      .digit { font-size: 62px; }
      .decimal-card { width: 26px; height: 91px; font-size: 52px; }
      .digit-label { margin-top: 7px; font-size: 10px; letter-spacing: 0; }
      .machine-message { font-size: 14px; }
      .main-button { min-height: 58px; font-size: 17px; padding: 10px 14px; }
      .visual-side { padding: 22px 16px; }
      .parent-note { padding: 15px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>1</span><span>2</span></div>
        <div>
          <h1>数字咔哒机</h1>
          <p>给小小数字观察员</p>
        </div>
      </div>
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="关闭声音">
        <span id="soundIcon" aria-hidden="true">♪</span><span id="soundText">声音开着</span>
      </button>
    </header>

    <nav class="lessons" role="tablist" aria-label="选择数字游戏">
      <button class="lesson-tab" id="tab-carry" role="tab" aria-selected="true" aria-controls="machine" data-mode="carry" type="button">
        <span class="lesson-number">01</span><span>进位</span>
      </button>
      <button class="lesson-tab" id="tab-borrow" role="tab" aria-selected="false" aria-controls="machine" data-mode="borrow" type="button" tabindex="-1">
        <span class="lesson-number">02</span><span>倒着拨</span>
      </button>
      <button class="lesson-tab" id="tab-decimal" role="tab" aria-selected="false" aria-controls="machine" data-mode="decimal" type="button" tabindex="-1">
        <span class="lesson-number">03</span><span>小数点</span>
      </button>
      <button class="lesson-tab" id="tab-float" role="tab" aria-selected="false" aria-controls="machine" data-mode="float" type="button" tabindex="-1">
        <span class="lesson-number">04</span><span>点点搬家</span>
      </button>
    </nav>

    <section class="machine" id="machine" role="tabpanel" aria-labelledby="tab-carry">
      <div class="machine-top">
        <div class="machine-id"><span class="status-light" aria-hidden="true"></span>Little number machine · No. 03</div>
        <button class="mini-button" id="resetButton" type="button" aria-label="重新开始当前游戏">↺ 重新开始</button>
      </div>

      <div class="play-area">
        <section class="counter-side">
          <p class="eyebrow" id="eyebrow">第一站 · 数字走到头</p>
          <h2 id="lessonTitle">9 后面，会发生什么？</h2>
          <p class="lesson-intro" id="lessonIntro">按一下，数字就往后走一格。</p>

          <div class="counter-case">
            <i class="screw tl" aria-hidden="true"></i><i class="screw tr" aria-hidden="true"></i>
            <i class="screw bl" aria-hidden="true"></i><i class="screw br" aria-hidden="true"></i>
            <div class="digits" id="digits" aria-hidden="true"></div>
          </div>

          <div class="machine-message" id="machineMessage">先按一下，让 09 往前走吧！</div>

          <div class="controls">
            <button class="back-button" id="backButton" type="button" aria-label="向后退一步">←</button>
            <button class="main-button" id="mainButton" type="button">拨一下 · ＋1</button>
          </div>

          <div class="shortcuts" id="shortcuts">
            <span>从这里试试</span>
            <button class="shortcut active" data-value="9" type="button">09</button>
            <button class="shortcut" data-value="19" type="button">19</button>
            <button class="shortcut" data-value="99" type="button">99</button>
          </div>
        </section>

        <aside class="visual-side">
          <div id="visual" aria-hidden="true"></div>
          <h3 class="visual-title" id="visualTitle">个位的小跑道</h3>
          <p class="visual-caption" id="visualCaption">9 是这一位的最后一站。</p>
          <button class="listen-button" id="listenButton" type="button"><span aria-hidden="true">♪</span> 听一听</button>
        </aside>
      </div>

      <details class="parent-note">
        <summary>给大人的一句话</summary>
          <p id="parentTip">让她自己按按钮。等两张牌都翻完，再指着说：“9 走到头了，个位回到 0，十位前进 1。”不用要求她复述。</p>
      </details>
    </section>

    <p class="footer">不考试，不着急。拨一拨，看一看，发现一个小秘密。</p>
    <div class="sr-only" id="announcement" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const els = {
        digits: $("digits"), message: $("machineMessage"), main: $("mainButton"), back: $("backButton"),
        shortcuts: $("shortcuts"), visual: $("visual"), visualTitle: $("visualTitle"),
        visualCaption: $("visualCaption"), title: $("lessonTitle"), intro: $("lessonIntro"),
        eyebrow: $("eyebrow"), parentTip: $("parentTip"), announcement: $("announcement"),
        machine: $("machine"), reset: $("resetButton"), listen: $("listenButton"),
        sound: $("soundToggle"), soundText: $("soundText"), soundIcon: $("soundIcon")
      };

      const copy = {
        carry: {
          eyebrow: "第一站 · 数字走到头",
          title: "9 后面，会发生什么？",
          intro: "按一下，数字就往后走一格。",
          parent: "让她自己按按钮。等两张牌都翻完，再指着说：“9 走到头了，个位回到 0，十位前进 1。”不用要求她复述。"
        },
        borrow: {
          eyebrow: "第二站 · 倒着拨",
          title: "10 往回走，会变成几？",
          intro: "按一下，数字就往回退一格。",
          parent: "按之前可以先问一句：“10 往回走一格，会是几？”猜错也没关系。等两张牌都翻完，再指着说：“个位从 0 跳回 9，十位往回退 1。”这就是进位倒过来走，不必讲“退位”这个词。"
        },
        decimal: {
          eyebrow: "第三站 · 认识小数点",
          title: "一杯，还可以再多一点",
          intro: "给果汁加一点点，看看小数点后面的数字。",
          parent: "指着杯子说：“小数点左边是完整的杯数，右边是下一杯里的一点点。”1.5 可以直接说成“一杯半”。"
        },
        float: {
          eyebrow: "第四站 · 小数点搬家",
          title: "数字没变，谁变高了？",
          intro: "还是 1、2、3，只让小数点左右搬家。",
          parent: "先让她猜小树会变高还是变矮，再移动小数点。这里只建立“点的位置会改变大小”的直觉，不必讲乘十、除十。"
        }
      };

      const state = {
        mode: "carry",
        carry: 9,
        borrow: 10,
        borrowWidth: 2,
        decimal: 10,
        float: 2,
        previous: null,
        lastAction: "start",
        sound: true
      };

      let audioContext = null;

      function clickSound(strength = 1) {
        if (!state.sound) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const now = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "square";
          oscillator.frequency.setValueAtTime(115 * strength, now);
          oscillator.frequency.exponentialRampToValueAtTime(65, now + .035);
          gain.gain.setValueAtTime(.035, now);
          gain.gain.exponentialRampToValueAtTime(.001, now + .045);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + .05);
        } catch (_) { /* The toy also works without Web Audio. */ }
      }

      function spokenNumber(text) {
        const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
        if (text.includes(".")) return text.split("").map((char) => char === "." ? "点" : digits[Number(char)]).join("");
        const value = Number(text);
        if (value < 10) return digits[value];
        if (value < 20) return "十" + (value % 10 ? digits[value % 10] : "");
        if (value < 100) return digits[Math.floor(value / 10)] + "十" + (value % 10 ? digits[value % 10] : "");
        const hundreds = digits[Math.floor(value / 100)] + "百";
        const remainder = value % 100;
        if (!remainder) return hundreds;
        return hundreds + (remainder < 10 ? "零" : "") + spokenNumber(String(remainder));
      }

      function speakCurrent() {
        if (!state.sound || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        let text = "";
        if (state.mode === "carry") {
          text = spokenNumber(String(state.carry));
          if (state.lastAction === "carry") text += "。九走到头了，个位回到零，左边前进一。";
        } else if (state.mode === "borrow") {
          text = spokenNumber(String(state.borrow));
          if (state.lastAction === "borrow") text += "。零退不动了，个位跳回九，左边往回退一。";
        } else if (state.mode === "decimal") {
          const whole = Math.floor(state.decimal / 10);
          const part = state.decimal % 10;
          text = spokenNumber(currentValue());
          if (part === 0) text += `。${spokenNumber(String(whole))}整杯，小数点后面是零。`;
          else if (part === 5) text += `。${spokenNumber(String(whole))}杯半。`;
          else text += `。${spokenNumber(String(whole))}整杯，再多一点点。`;
        } else {
          text = `${spokenNumber(currentValue())}。数字没有变，小数点的位置变了。`;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-CN";
        utterance.rate = .82;
        utterance.pitch = 1.08;
        window.speechSynthesis.speak(utterance);
      }

      function currentValue() {
        if (state.mode === "carry") return String(state.carry).padStart(2, "0");
        if (state.mode === "borrow") return String(state.borrow).padStart(state.borrowWidth, "0");
        if (state.mode === "decimal") return `${Math.floor(state.decimal / 10)}.${state.decimal % 10}`;
        return ["1.23", "12.3", "123"][state.float];
      }

      function labelFor(index, length) {
        return ["个位", "十位", "百位", "千位"][length - index - 1] || "数位";
      }

      function makeDigit(char, label, oldChar = null) {
        const wrap = document.createElement("div");
        wrap.className = "digit-wrap";
        const card = document.createElement("div");
        card.className = "digit-card";
        if (oldChar !== null && oldChar !== char) {
          const oldDigit = document.createElement("span");
          oldDigit.className = "digit old-digit";
          oldDigit.textContent = oldChar;
          card.appendChild(oldDigit);
        }
        const digit = document.createElement("span");
        digit.className = "digit" + (oldChar !== null && oldChar !== char ? " new-digit" : "");
        digit.textContent = char;
        card.appendChild(digit);
        const caption = document.createElement("span");
        caption.className = "digit-label";
        caption.textContent = label;
        wrap.append(card, caption);
        return wrap;
      }

      function makePoint() {
        const wrap = document.createElement("div");
        wrap.className = "decimal-wrap";
        wrap.innerHTML = '<div class="decimal-card">·</div><span class="digit-label">小数点</span>';
        return wrap;
      }

      function renderDigits(oldValue) {
        const value = currentValue();
        els.digits.replaceChildren();
        if (state.mode === "float") {
          const pointAfter = [1, 2, 3][state.float];
          for (let i = 0; i < value.length; i++) {
            if (value[i] === ".") continue;
            els.digits.appendChild(makeDigit(value[i], "数字不变"));
            const digitPosition = els.digits.children.length;
            if (digitPosition === pointAfter && state.float < 2) els.digits.appendChild(makePoint());
          }
          return;
        }

        const chars = value.split("");
        const oldChars = oldValue ? oldValue.padStart(chars.length, "0").split("") : [];
        chars.forEach((char, index) => {
          if (char === ".") {
            els.digits.appendChild(makePoint());
          } else {
            const beforePoint = !value.includes(".") || index < value.indexOf(".");
            const label = state.mode === "decimal"
              ? (beforePoint ? "完整的一杯" : "再多一点点")
              : labelFor(index, chars.length);
            els.digits.appendChild(makeDigit(char, label, oldChars[index] ?? null));
          }
        });
      }

      function carryVisual() {
        const current = state.carry % 10;
        els.visual.innerHTML = `
          <div class="route">
            <span class="route-digit ${current === 8 ? "hot" : ""}">8</span>
            <span class="route-arrow">→</span>
            <span class="route-digit ${current === 9 ? "hot" : ""}">9</span>
            <span class="route-arrow">→</span>
            <span class="route-digit ${current === 0 && state.lastAction === "carry" ? "hot" : ""}">0</span>
          </div>
          <div class="route-plus">个位到 9，再请左边帮忙</div>`;
        if (state.lastAction === "carry") {
          els.visualTitle.textContent = "咔哒！左边前进 1";
          els.visualCaption.textContent = "9 回到 0，旁边那一位往前走。";
        } else if (current === 9) {
          els.visualTitle.textContent = "个位到最后一站啦";
          els.visualCaption.textContent = "再拨一下，看看谁会一起翻牌。";
        } else {
          els.visualTitle.textContent = "个位的小跑道";
          els.visualCaption.textContent = "每一位都从 0 走到 9，再回到 0。";
        }
      }

      function borrowVisual() {
        const current = state.borrow % 10;
        els.visual.innerHTML = `
          <div class="route">
            <span class="route-digit ${current === 1 ? "hot" : ""}">1</span>
            <span class="route-arrow">→</span>
            <span class="route-digit ${current === 0 ? "hot" : ""}">0</span>
            <span class="route-arrow">→</span>
            <span class="route-digit ${current === 9 && state.lastAction === "borrow" ? "hot" : ""}">9</span>
          </div>
          <div class="route-plus">个位到 0，再请左边退一格</div>`;
        if (state.borrow === 0) {
          els.visualTitle.textContent = "退到最前面啦";
          els.visualCaption.textContent = "00 再往回，就没有数字了。";
        } else if (state.lastAction === "borrow") {
          els.visualTitle.textContent = "咔哒！左边退回 1";
          els.visualCaption.textContent = "0 跳回 9，旁边那一位往回走。";
        } else if (current === 0) {
          els.visualTitle.textContent = "个位回到起点啦";
          els.visualCaption.textContent = "再倒着拨一下，看看谁会一起翻牌。";
        } else {
          els.visualTitle.textContent = "倒着走的小跑道";
          els.visualCaption.textContent = "倒着走也一样：一路退到 0，再跳回 9。";
        }
      }

      function decimalVisual() {
        const whole = Math.floor(state.decimal / 10);
        const part = state.decimal % 10;
        const cupCount = Math.min(3, whole + 1);
        let cups = "";
        for (let i = 0; i < cupCount; i++) {
          const fill = i < whole ? 100 : (i === whole ? part * 10 : 0);
          const label = i < whole ? "一整杯" : (i === whole && part ? "再多一点" : "下一杯");
          cups += `<div><div class="cup"><div class="juice" style="--fill:${fill}%"></div></div><div class="cup-label">${label}</div></div>`;
        }
        els.visual.innerHTML = `<div class="cups">${cups}</div>`;
        if (part === 5) {
          els.visualTitle.textContent = `${whole} 杯半`;
          els.visualCaption.textContent = `${currentValue()} 在 ${whole} 和 ${whole + 1} 之间。`;
        } else if (part === 0) {
          els.visualTitle.textContent = `${whole} 个完整的一杯`;
          els.visualCaption.textContent = `小数点后面是 0，没有再多出来。`;
        } else {
          els.visualTitle.textContent = `${whole} 杯，再多一点点`;
          els.visualCaption.textContent = "小数点后面，装着不到一整杯的部分。";
        }
      }

      function floatVisual() {
        const grows = [.56, .77, 1];
        const names = ["小小的树", "高一些的树", "高高的树"];
        els.visual.innerHTML = `
          <div class="tree-scene">
            <svg viewBox="0 0 240 210" role="img" aria-label="小树的高低表示数量大小">
              <ellipse cx="120" cy="187" rx="78" ry="10" fill="#dfd3bd"/>
              <g class="tree-grow" style="--grow:${grows[state.float]}">
                <path d="M112 178 L113 103 Q120 94 127 103 L129 178Z" fill="#9a643e" stroke="#243832" stroke-width="3"/>
                <path d="M119 132 L89 105 M122 121 L151 89" fill="none" stroke="#243832" stroke-width="5" stroke-linecap="round"/>
                <circle cx="119" cy="71" r="45" fill="#6f9b70" stroke="#243832" stroke-width="3"/>
                <circle cx="78" cy="99" r="31" fill="#89ad78" stroke="#243832" stroke-width="3"/>
                <circle cx="159" cy="96" r="34" fill="#4f7a65" stroke="#243832" stroke-width="3"/>
                <circle cx="97" cy="48" r="27" fill="#96b97d" stroke="#243832" stroke-width="3"/>
                <circle cx="153" cy="54" r="29" fill="#7ca674" stroke="#243832" stroke-width="3"/>
                <circle cx="84" cy="91" r="5" fill="#f4c65d"/><circle cx="143" cy="73" r="5" fill="#f4c65d"/>
              </g>
              <path d="M91 177 H149 L141 199 H99Z" fill="#ee7245" stroke="#243832" stroke-width="3" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="point-steps">${[0,1,2].map(i => `<span class="point-step ${i === state.float ? "active" : ""}"></span>`).join("")}</div>`;
        els.visualTitle.textContent = names[state.float];
        const captions = [
          "点在最左边，表示的数量最小。",
          "还是这三个数字，数量变大了。",
          "点藏在最后面，表示的数量最大。"
        ];
        els.visualCaption.textContent = captions[state.float];
      }

      function setMessage() {
        let text = "";
        let celebrate = false;
        if (state.mode === "carry") {
          if (state.lastAction === "carry") {
            text = "咔哒！9 → 0，左边前进 1！";
            celebrate = true;
          } else if (state.lastAction === "back") {
            text = `倒回来啦，现在是 ${currentValue()}。`;
          } else if (state.lastAction === "next") {
            text = state.carry % 10 === 9 ? "到 9 啦，再拨一下看看！" : `往前走了一格，现在是 ${currentValue()}。`;
          } else {
            text = `先按一下，让 ${currentValue()} 往前走吧！`;
          }
        } else if (state.mode === "borrow") {
          if (state.lastAction === "borrow") {
            text = "咔哒！0 → 9，左边退回 1！";
            celebrate = true;
          } else if (state.borrow === 0) {
            text = "退到 00 啦，没有更小的了。按 → 可以往前走。";
          } else if (state.lastAction === "forward") {
            text = `往前走了一格，现在是 ${currentValue()}。`;
          } else if (state.lastAction === "next") {
            text = state.borrow % 10 === 0 ? "到 0 啦，再倒着拨一下看看！" : `往回退了一格，现在是 ${currentValue()}。`;
          } else {
            text = `先按一下，让 ${currentValue()} 往回走吧！`;
          }
        } else if (state.mode === "decimal") {
          if (state.lastAction === "carry") {
            text = "小数点后面也会进位：1.9 → 2.0！";
            celebrate = true;
          } else if (state.lastAction === "start") {
            text = "按“加一点”，看看杯子和小数怎样变化。";
          } else if (state.decimal % 10 === 0) {
            text = `现在是 ${Math.floor(state.decimal / 10)} 个完整的一杯，小数点后面是 0。`;
          } else if (state.decimal % 10 === 5) {
            text = `${currentValue()} 就是 ${Math.floor(state.decimal / 10)} 杯半。`;
          } else {
            text = `现在比 ${Math.floor(state.decimal / 10)} 杯多，比 ${Math.floor(state.decimal / 10) + 1} 杯少。`;
          }
        } else {
          if (state.lastAction === "left") {
            text = "小数点往左，表示的数量变小啦！";
          } else if (state.lastAction === "right") {
            text = "小数点往右，表示的数量变大啦！";
          } else {
            text = "按“往左移”，让小数点出来搬家。";
          }
        }
        els.message.textContent = text;
        els.message.classList.toggle("celebrate", celebrate);
        els.announcement.textContent = `${currentValue()}。${text}`;
      }

      function renderShortcuts() {
        if (state.mode === "carry") {
          els.shortcuts.innerHTML = `<span>从这里试试</span>${[9,19,99].map(v => `<button class="shortcut ${state.carry === v ? "active" : ""}" data-value="${v}" type="button">${String(v).padStart(2,"0")}</button>`).join("")}`;
        } else if (state.mode === "borrow") {
          els.shortcuts.innerHTML = `<span>从这里试试</span>${[10,20,100].map(v => `<button class="shortcut ${state.borrow === v ? "active" : ""}" data-value="${v}" type="button">${String(v).padStart(2,"0")}</button>`).join("")}`;
        } else if (state.mode === "decimal") {
          els.shortcuts.innerHTML = `<span>看看这些</span>${[[10,"1.0"],[15,"1.5"],[19,"1.9"]].map(([v,label]) => `<button class="shortcut ${state.decimal === v ? "active" : ""}" data-value="${v}" type="button">${label}</button>`).join("")}`;
        } else {
          els.shortcuts.innerHTML = `<span>三个数字不动，只有小数点在动</span>`;
        }
      }

      function render(oldValue = null) {
        const info = copy[state.mode];
        els.eyebrow.textContent = info.eyebrow;
        els.title.textContent = info.title;
        els.intro.textContent = info.intro;
        els.parentTip.textContent = info.parent;
        renderDigits(oldValue);
        setMessage();
        renderShortcuts();

        if (state.mode === "carry") {
          els.main.textContent = "拨一下 · ＋1";
          els.back.textContent = "←";
          els.back.setAttribute("aria-label", "数字向后退一步");
          els.main.disabled = state.carry >= 999;
          els.back.disabled = state.carry <= 0;
          carryVisual();
        } else if (state.mode === "borrow") {
          els.main.textContent = "倒着拨 · －1";
          els.back.textContent = "→";
          els.back.setAttribute("aria-label", "数字向前走一步");
          els.main.disabled = state.borrow <= 0;
          els.back.disabled = state.borrow >= 999;
          borrowVisual();
        } else if (state.mode === "decimal") {
          els.main.textContent = "加一点 · ＋0.1";
          els.back.textContent = "←";
          els.back.setAttribute("aria-label", "果汁倒回一点");
          els.main.disabled = state.decimal >= 20;
          els.back.disabled = state.decimal <= 0;
          decimalVisual();
        } else {
          els.main.textContent = "小数点往左移 · ←";
          els.back.textContent = "→";
          els.back.setAttribute("aria-label", "小数点往右移");
          els.main.disabled = state.float <= 0;
          els.back.disabled = state.float >= 2;
          floatVisual();
        }
      }

      function changeMode(mode) {
        if (!copy[mode]) return;
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        state.mode = mode;
        state.lastAction = "start";
        document.querySelectorAll(".lesson-tab").forEach((tab) => {
          const selected = tab.dataset.mode === mode;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
          if (selected) els.machine.setAttribute("aria-labelledby", tab.id);
        });
        clickSound(.8);
        render();
      }

      function moveForward() {
        const oldValue = currentValue();
        if (state.mode === "carry" && state.carry < 999) {
          state.lastAction = state.carry % 10 === 9 ? "carry" : "next";
          state.carry++;
        } else if (state.mode === "borrow" && state.borrow > 0) {
          state.lastAction = state.borrow % 10 === 0 ? "borrow" : "next";
          state.borrow--;
        } else if (state.mode === "decimal" && state.decimal < 20) {
          state.lastAction = state.decimal % 10 === 9 ? "carry" : "next";
          state.decimal++;
        } else if (state.mode === "float" && state.float > 0) {
          state.float--;
          state.lastAction = "left";
        } else return;
        const chain = state.lastAction === "carry" || state.lastAction === "borrow";
        clickSound(chain ? 1.4 : 1);
        if (chain) setTimeout(() => clickSound(1.8), 190);
        render(oldValue);
        if (chain) setTimeout(speakCurrent, 600);
      }

      function moveBack() {
        const oldValue = currentValue();
        if (state.mode === "carry" && state.carry > 0) {
          state.carry--;
          state.lastAction = "back";
        } else if (state.mode === "borrow" && state.borrow < 999) {
          state.borrow++;
          state.borrowWidth = Math.max(state.borrowWidth, String(state.borrow).length);
          state.lastAction = "forward";
        } else if (state.mode === "decimal" && state.decimal > 0) {
          state.decimal--;
          state.lastAction = "back";
        } else if (state.mode === "float" && state.float < 2) {
          state.float++;
          state.lastAction = "right";
        } else return;
        clickSound(.75);
        render(oldValue);
      }

      document.querySelectorAll(".lesson-tab").forEach((tab) => {
        tab.addEventListener("click", () => changeMode(tab.dataset.mode));
        tab.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
          event.preventDefault();
          const modes = ["carry", "borrow", "decimal", "float"];
          const direction = event.key === "ArrowRight" ? 1 : -1;
          const next = (modes.indexOf(state.mode) + direction + modes.length) % modes.length;
          changeMode(modes[next]);
          $(`tab-${modes[next]}`).focus();
        });
      });

      els.main.addEventListener("click", moveForward);
      els.back.addEventListener("click", moveBack);
      els.listen.addEventListener("click", () => { clickSound(1.2); speakCurrent(); });
      els.reset.addEventListener("click", () => {
        if (state.mode === "carry") state.carry = 9;
        if (state.mode === "borrow") { state.borrow = 10; state.borrowWidth = 2; }
        if (state.mode === "decimal") state.decimal = 10;
        if (state.mode === "float") state.float = 2;
        state.lastAction = "start";
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        clickSound(.8);
        render();
      });

      els.shortcuts.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-value]");
        if (!button) return;
        const value = Number(button.dataset.value);
        const oldValue = currentValue();
        if (state.mode === "carry") state.carry = value;
        if (state.mode === "borrow") { state.borrow = value; state.borrowWidth = Math.max(2, String(value).length); }
        if (state.mode === "decimal") state.decimal = value;
        state.lastAction = "start";
        clickSound();
        render(oldValue);
      });

      els.sound.addEventListener("click", () => {
        state.sound = !state.sound;
        els.sound.setAttribute("aria-pressed", String(state.sound));
        els.sound.setAttribute("aria-label", state.sound ? "关闭声音" : "打开声音");
        els.soundText.textContent = state.sound ? "声音开着" : "声音关了";
        els.soundIcon.textContent = state.sound ? "♪" : "×";
        if (!state.sound && "speechSynthesis" in window) window.speechSynthesis.cancel();
        if (state.sound) clickSound();
      });

      render();
    })();
  </script>
</body>
</html>
